name: GitOps CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Validate Helm chart
        run: |
          helm lint --strict helm/sample-nodejs
          helm template sample-nodejs helm/sample-nodejs > /dev/null
